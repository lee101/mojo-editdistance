[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-editdistance"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"
# Needs MOJO=<mojo from an env with `max>`; the repo env has no `max`. See README.
gpu-probe = "python bench/gpu_probe.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092605"
python = "3.13.*"
pytest = "*"
numpy = "*"
editdistance = "==0.8.1"
